name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: memor-linux-x64
          - goos: linux
            goarch: arm64
            name: memor-linux-arm64
          - goos: darwin
            goarch: amd64
            name: memor-darwin-x64
          - goos: darwin
            goarch: arm64
            name: memor-darwin-arm64
          - goos: windows
            goarch: amd64
            name: memor-win32-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X github.com/memor-dev/memor/cmd.Version=${GITHUB_REF_NAME#v}" -o dist/${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate npm package version
        working-directory: npm
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version=${GITHUB_REF_NAME#v}
          if [[ "$tag_version" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            tag_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
          elif [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME. Expected vMAJOR.MINOR or vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "package.json version $package_version does not match normalized tag version $tag_version from $GITHUB_REF_NAME" >&2
            exit 1
          fi
          npm pkg fix --dry-run

      - name: Validate npm credentials
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN is not configured for this repository." >&2
            exit 1
          fi

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
